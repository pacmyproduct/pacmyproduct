name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy Next.js Node Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Clean installation of npm dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build Next.js full-stack production application
      - name: Build Next.js Production Application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://pacmyproduct.com' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://pacmyproduct.com' }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || 'https://pacmyproduct.com,https://www.pacmyproduct.com' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: npm run build

      # Step 5: Safely remove stale remote public_html/.next directory to prevent 550 file/folder collisions
      - name: Clean Remote Stale .next Directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
        run: |
          npm install basic-ftp --no-save
          node -e '
            const ftp = require("basic-ftp");
            async function run() {
              const client = new ftp.Client(30000);
              try {
                await client.access({
                  host: process.env.FTP_SERVER,
                  user: process.env.FTP_USERNAME,
                  password: process.env.FTP_PASSWORD,
                  port: parseInt(process.env.FTP_PORT || "21"),
                  secure: false
                });
                console.log("Safely removing stale public_html/.next directory before upload...");
                await client.removeDir("public_html/.next");
                console.log("Successfully removed stale public_html/.next directory.");
              } catch (err) {
                console.log("Remote .next cleanup status:", err.message);
              } finally {
                client.close();
              }
            }
            run();
          ' || true

      # Step 6: Deploy production application to Hostinger public_html via FTP
      - name: Deploy Production Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env*
            **/.edge-brands-shot/**
            **/.chrome-brands-shot/**
            **/screenshots/**
            **/scratch/**
            **/docs/**
            **/coverage/**
            **/*.log
            **/image-audit-report.json
            **/cloudinary-*.json
            **/CLOUDINARY_*.md
            **/DEPLOYMENT_READINESS_REPORT.md
            **/README.md
            **/publiclogosfallback.txt
